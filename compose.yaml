services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: order_assistant
      POSTGRES_USER: order_assistant
      POSTGRES_PASSWORD: order_assistant
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U order_assistant -d order_assistant"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - order-assistant-postgres:/var/lib/postgresql/data

volumes:
  order-assistant-postgres:
